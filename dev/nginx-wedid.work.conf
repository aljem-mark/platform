# Reverse-proxy template for a public domain (e.g. wedid.work) — nginx + TLS.
# Replace REPLACE_ME_DOMAIN with your domain, and REPLACE_ME_* paths as noted.
#
# Setup on the server:
#   sudo cp dev/nginx-wedid.work.conf /etc/nginx/sites-available/<domain>
#   sudo ln -s /etc/nginx/sites-available/<domain> /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d <domain>          # obtains + installs certificates
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires: DNS A record <domain> -> server IP; ports 80/443 open.
# Host ports below come from dev/docker-compose.yaml:
#   front 8087, account 3000, collaborator 3078, rekoni 4004, datalake 4030,
#   stream 1080. `branding.json`, `/files` and the SPA are served by front.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name REPLACE_ME_DOMAIN www.REPLACE_ME_DOMAIN;
    # certbot handles the ACME challenge and the redirect to https
}

server {
    listen 443 ssl;
    http2 on;
    server_name REPLACE_ME_DOMAIN;

    # certbot injects certificate paths on first run, e.g.:
    # ssl_certificate     /etc/letsencrypt/live/REPLACE_ME_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/REPLACE_ME_DOMAIN/privkey.pem;

    client_max_body_size 512m;   # attachments / file upload

    # ---- API docs: deny publicly (defense-in-depth under DOC_MODE) ----
    # Uncomment the allow line for your office/VPN range, or delete this block
    # entirely to rely on the DOC_MODE gate alone.
    location ~ ^/(api/docs|api/openapi\.yaml)$ {
        # allow 203.0.113.0/24;
        deny all;
    }

    # ---- Browser-facing services (must match docker-compose override) ----
    location /accounts/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collaborator/ {
        proxy_pass http://127.0.0.1:3078/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /collaborator {
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /rekoni/ {
        proxy_pass http://127.0.0.1:4004/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /datalake/ {
        proxy_pass http://127.0.0.1:4030/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
    }

    location /stream/ {
        proxy_pass http://127.0.0.1:1080/;
        proxy_set_header Host $host;
        client_max_body_size 512m;
    }

    # ---- Everything else -> front (SPA + /api/v1 + /files + branding.json) ----
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}